name: Windows diagnostic
on:
  push:
    branches: [windows-trace-diagnostic]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version
      - run: npm ci
      - run: npm test
